name: Generate Warframe Ability Icons

on:
  push:
    branches:
      - The-Void
    paths:
      - 'tools/bake_warframe_ability_icons.py'
      - '.github/workflows/generate-warframe-ability-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --upgrade pillow
      - name: Fetch and bake Warframe Wiki ability icons
        run: python3 tools/bake_warframe_ability_icons.py
      - name: Commit generated Warframe ability sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/destiny2mc/textures/gui/sprites/binder/ability/*.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(binder): bake Warframe Wiki icons for Warframe abilities and passives"
            git push
          fi
