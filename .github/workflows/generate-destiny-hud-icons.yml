name: Generate Destiny HUD Icons

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'tools/bake_destiny_hud_icons.py'
      - '.github/workflows/generate-destiny-hud-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CairoSVG and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2
          python -m pip install --upgrade pillow cairosvg
      - name: Fetch and bake CC0 Destiny HUD icons
        run: python3 tools/bake_destiny_hud_icons.py
      - name: Commit generated HUD sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/destiny2mc/textures/gui/silhouettes/*.png \
                  src/main/resources/assets/destiny2mc/textures/gui/hud/*.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(hud): bake CC0 Destiny weapon, element, and ammo HUD icons"
            git push
          fi
