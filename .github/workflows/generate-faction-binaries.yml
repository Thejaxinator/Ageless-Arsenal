name: Generate Faction Binary Assets

on:
  push:
    branches:
      - feat/faction-biomes-and-structures
    paths:
      - 'tools/generate_faction_*.py'
      - '.github/workflows/generate-faction-binaries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate faction NBT structures and radiolaria texture
        run: |
          python3 tools/generate_faction_worldgen.py
          python3 tools/generate_faction_decor.py
      - name: Commit generated binary assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/data/destiny2mc/structure/factions src/main/resources/assets/destiny2mc/textures/block/fake_radiolaria.png
          git diff --cached --quiet || git commit -m "Add generated faction NBT structures and radiolaria texture"
          git push
